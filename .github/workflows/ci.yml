# Quality gate: every pull request and every push to main must typecheck,
# pass the tests and build, or the run fails and the change shouldn't merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The same production build Vercel runs. It needs the Supabase variables
      # to exist, not to work: no page is rendered against Supabase at build.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
